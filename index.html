<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📖 Bíblia Multi-API — Offline</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f8fafc; --card:#ffffff; --text:#1e293b; --p:#854d0e; --g:#64748b; 
  --b:#e2e8f0; --r:12px; --shadow:0 2px 8px rgba(0,0,0,.08);
  --active:#fef3c7; --sucesso:#10b981; --erro:#ef4444;
  --hl-1: #fef08a; --hl-2: #bbf7d0; --hl-3: #bfdbfe; --hl-4: #fbcfe8; --hl-5: #fed7aa;
}
.dark{
  --bg:#1a120b; --card:#261c13; --text:#f0e6d8; --b:#4a3528;
  --active:#423020;
  --hl-1: rgba(254, 240, 138, 0.25); --hl-2: rgba(187, 247, 208, 0.25); 
  --hl-3: rgba(191, 219, 254, 0.25); --hl-4: rgba(251, 207, 232, 0.25); --hl-5: rgba(254, 215, 170, 0.25);
}
body{background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:90px; transition:background .3s,color .3s;}

header{position:sticky; top:0; background:var(--card); padding:14px 16px; box-shadow:var(--shadow); z-index:100; display:flex; align-items:center; justify-content:space-between;}
header h1{font-size:1.1rem; font-weight:700; color:var(--p);}
.header-btns{display:flex; gap:8px;}
header button{background:none; border:none; font-size:1.2rem; cursor:pointer; padding:6px 10px; border-radius:6px;}

.info-bar{background:var(--active); padding:10px 16px; font-size:.9rem; color:var(--p); text-align:center; border-bottom:1px solid var(--b); line-height:1.5;}
.status-api{font-size:.8rem; margin-top:4px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center;}
.api-tag{padding:2px 8px; border-radius:12px; background:var(--b); font-size:.75rem;}
.api-tag.ok{background:rgba(16,185,129,.15); color:#059669;}
.api-tag.busy{background:rgba(245,158,11,.15); color:#d97706;}
.api-tag.fail{background:rgba(239,68,68,.15); color:#dc2626;}

.tabs{display:flex; gap:8px; padding:12px 16px; overflow-x:auto; border-bottom:1px solid var(--b); background:var(--card);}
.tab{padding:8px 18px; border-radius:20px; border:none; background:transparent; color:var(--g); font-weight:600; cursor:pointer; white-space:nowrap; font-size:.95rem;}
.tab.active{background:var(--p); color:#fff;}

.book-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; padding:16px; max-width:700px; margin:0 auto;}
.book-btn{padding:12px 8px; border-radius:var(--r); border:1px solid var(--b); background:var(--card); color:var(--text); font-size:.9rem; cursor:pointer; transition:all .2s; display:flex; flex-direction:column; align-items:center; gap:4px;}
.book-btn:hover{border-color:var(--p); transform:translateY(-2px); box-shadow:var(--shadow);}
.book-btn.loaded{border-color:var(--sucesso); background:rgba(16,185,129,.08);}
.book-btn.downloading{border-color:#f59e0b; background:rgba(245,158,11,.08); animation:pulse 1s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:.6;}100%{opacity:1;}}
.book-btn .num{font-weight:700; color:var(--p); font-size:.85rem;}
.book-btn .status{font-size:.75rem; color:var(--g); margin-top:2px;}
.book-btn.loaded .status{color:var(--sucesso);}
.book-btn.downloading .status{color:#d97706;}

.screen{display:none; padding:16px; max-width:720px; margin:0 auto;}
.screen.active{display:block;}

.read-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:12px;}
.read-header h2{font-size:1.1rem; color:var(--p); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.header-actions{display:flex; gap:8px;}
.header-actions button{padding:6px 10px; border-radius:6px; border:none; background:var(--b); color:var(--text); cursor:pointer; font-weight:700; font-size:.9rem;}

.chapter-nav{display:flex; justify-content:space-between; align-items:center; margin:16px 0; padding-bottom:12px; border-bottom:1px solid var(--b); flex-wrap:wrap; gap:10px;}
.chapter-nav button{padding:10px 16px; border-radius:8px; border:none; background:var(--p); color:#fff; cursor:pointer; font-weight:600; font-size:.9rem; transition:opacity .2s;}
.chapter-nav button:disabled{opacity:.35; cursor:not-allowed;}
.chapter-number{font-weight:700; font-size:1rem; color:var(--p); text-align:center; flex:1; min-width:120px;}

.download-all-bar{background:rgba(16,185,129,.1); border:1px solid var(--sucesso); padding:10px 14px; border-radius:10px; margin:12px 0; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;}
.download-all-bar button{padding:8px 14px; border-radius:6px; border:none; background:var(--sucesso); color:#fff; font-weight:600; cursor:pointer; font-size:.9rem;}
.progress-bar{width:100%; height:6px; background:var(--b); border-radius:3px; margin-top:8px; overflow:hidden;}
.progress-fill{height:100%; background:var(--sucesso); width:0%; transition:width .3s;}

.size-small .verse{font-size:.95rem; line-height:1.6;}
.size-medium .verse{font-size:1.05rem; line-height:1.75;}
.size-large .verse{font-size:1.2rem; line-height:1.85;}

.verse{
  padding:12px 10px; margin:6px 0; border-radius:8px; 
  word-wrap:break-word !important; overflow-wrap:break-word !important;
  word-break:normal !important; hyphens:none !important;
  -webkit-hyphens:none !important; -moz-hyphens:none !important;
  text-align:justify; cursor:pointer; transition:background .2s; position:relative;
  border-bottom:1px solid rgba(0,0,0,.03);
}
.dark .verse{border-bottom:1px solid rgba(255,255,255,.05);}
.verse:active{background:rgba(0,0,0,.05);}
.dark .verse:active{background:rgba(255,255,255,.05);}

/* Cores de Destaque */
.verse.hl-1 { background-color: var(--hl-1); }
.verse.hl-2 { background-color: var(--hl-2); }
.verse.hl-3 { background-color: var(--hl-3); }
.verse.hl-4 { background-color: var(--hl-4); }
.verse.hl-5 { background-color: var(--hl-5); }

.verse-num{font-weight:700; color:var(--p); margin-right:12px; font-size:.95rem; display:inline-block; min-width:32px;}
.verse-fav-icon{position:absolute; right:10px; top:12px; font-size:1rem; opacity:.3;}
.verse.is-favorite .verse-fav-icon{opacity:1; color:#ef4444;}

.empty-state{text-align:center; padding:60px 20px; color:var(--g); font-size:1rem; line-height:1.6;}
.loading{text-align:center; padding:40px 20px; color:var(--p); font-size:1rem;}
.loading span{display:inline-block; animation:bounce .6s infinite alternate;}
@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-6px);}}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:12px 24px; border-radius:var(--r); box-shadow:var(--shadow); z-index:1000; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90%; text-align:center; font-size:.9rem;}
.toast.show{opacity:1;}

nav{position:fixed; bottom:0; left:0; right:0; background:var(--card); display:flex; justify-content:space-around; padding:10px 0; box-shadow:0 -2px 10px rgba(0,0,0,.08); z-index:100; border-top:1px solid var(--b);}
nav button{background:none; border:none; font-size:.75rem; color:var(--g); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; flex:1;}
nav button span{font-size:1.3rem;}
nav button.active{color:var(--p); font-weight:600;}

.hidden{display:none !important;}

.fav-item{padding:14px; background:var(--card); border:1px solid var(--b); border-radius:10px; margin-bottom:10px; cursor:pointer;}
.fav-item:active{background:var(--active);}
.fav-ref{font-weight:700; color:var(--p); font-size:.9rem; margin-bottom:4px;}
.fav-text{font-size:.95rem; line-height:1.5; color:var(--text);}

#verseActionMenu{
  position:fixed; bottom:0; left:0; right:0; background:var(--card); 
  border-radius:20px 20px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,.15);
  padding:20px; z-index:200; transform:translateY(100%); transition:transform .3s ease;
}
#verseActionMenu.show{transform:translateY(0);}
.menu-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:190; opacity:0; pointer-events:none; transition:opacity .3s;}
.menu-overlay.show{opacity:1; pointer-events:auto;}
.menu-title{font-weight:700; margin-bottom:16px; color:var(--p); font-size:1rem;}

.highlight-colors{display:flex; gap:12px; justify-content:center; margin-bottom:16px;}
.color-btn{width:40px; height:40px; border-radius:50%; border:3px solid transparent; cursor:pointer; transition:transform .2s;}
.color-btn:active{transform:scale(0.9);}
.color-btn.active{border-color:var(--text); transform:scale(1.1);}
.c1{background:#fef08a;} .dark .c1{background:rgba(254,240,138,0.4);}
.c2{background:#bbf7d0;} .dark .c2{background:rgba(187,247,208,0.4);}
.c3{background:#bfdbfe;} .dark .c3{background:rgba(191,219,254,0.4);}
.c4{background:#fbcfe8;} .dark .c4{background:rgba(251,207,232,0.4);}
.c5{background:#fed7aa;} .dark .c5{background:rgba(254,215,170,0.4);}
.c-none{background:var(--b); display:flex; align-items:center; justify-content:center; font-size:1.2rem;}

.action-btn{width:100%; padding:14px; border-radius:10px; border:none; font-weight:700; font-size:1rem; cursor:pointer; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn-fav{background:var(--active); color:var(--p);}
.btn-fav.active{background:#ef4444; color:#fff;}
.btn-close-menu{background:var(--b); color:var(--text); margin-top:16px;}

/* Modal de Busca */
#searchModal{
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; 
  display:flex; align-items:center; justify-content:center; padding:20px;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
#searchModal.show{opacity:1; pointer-events:auto;}
.search-box{
  background:var(--card); width:100%; max-width:400px; padding:24px; 
  border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,.2);
}
.search-box h3{margin-bottom:16px; color:var(--p);}
.search-input{
  width:100%; padding:12px; border:2px solid var(--b); border-radius:8px; 
  font-size:1rem; background:var(--bg); color:var(--text); margin-bottom:16px;
}
.search-input:focus{outline:none; border-color:var(--p);}
.search-btns{display:flex; gap:10px;}
.search-btns button{flex:1; padding:12px; border-radius:8px; border:none; font-weight:700; cursor:pointer; font-size:1rem;}
.btn-search-go{background:var(--p); color:#fff;}
.btn-search-cancel{background:var(--b); color:var(--text);}
</style>
</head>
<body>

<header>
  <h1>📖 Bíblia Multi-API</h1>
  <div class="header-btns">
    <button id="btnClear" title="Limpar dados">🗑️</button>
    <button id="btnTheme" title="Tema">🌙</button>
  </div>
</header>

<div class="info-bar" id="infoBar">
  📶 Online → Offline: Busca inteligente com fallback! Baixe uma vez e leia sem internet.
  <div class="status-api" id="apiStatus"></div>
  <div style="margin-top:6px; font-size:.85rem;">📚 <span id="savedCount">0</span>/66 livros salvos offline</div>
</div>

<div id="booksScreen" class="screen active">
  <div class="tabs">
    <button class="tab active" data-test="AT">📜 Antigo (01-39)</button>
    <button class="tab" data-test="NT">✝️ Novo (40-66)</button>
  </div>
  
  <div class="download-all-bar">
    <div>⬇️ Baixar todos os livros</div>
    <button id="btnDownloadAll">Iniciar Download</button>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  
  <div class="book-grid" id="bookList"></div>
</div>

<div id="readScreen" class="screen">
  <div class="read-header">
    <button class="btn-back" id="btnBack">← Voltar</button>
    <h2 id="bookTitle"></h2>
    <div class="header-actions">
      <button id="btnSearch" title="Buscar Capítulo">🔍</button>
      <button id="btnFontSize" title="Tamanho da Fonte">Aa</button>
    </div>
  </div>
  <div class="chapter-nav">
    <button id="btnPrev">← Capítulo</button>
    <span class="chapter-number" id="chapterTitle">Capítulo 1</span>
    <button id="btnNext">Capítulo →</button>
  </div>
  <div id="versesContainer"></div>
</div>

<div id="favoritesScreen" class="screen">
  <h2 style="margin-bottom:16px; color:var(--p);">⭐ Meus Favoritos</h2>
  <div id="favoritesList"></div>
</div>

<!-- Modal de Busca -->
<div id="searchModal">
  <div class="search-box">
    <h3>🔍 Ir para Capítulo</h3>
    <input type="text" id="searchInput" class="search-input" placeholder="Ex: João 3, sl 23, gn 1, ou apenas 5" autocomplete="off">
    <div class="search-btns">
      <button class="btn-search-cancel" id="btnSearchCancel">Cancelar</button>
      <button class="btn-search-go" id="btnSearchGo">Buscar</button>
    </div>
  </div>
</div>

<div class="menu-overlay" id="menuOverlay"></div>
<div id="verseActionMenu">
  <div class="menu-title">Marcar Versículo</div>
  <div class="highlight-colors">
    <button class="color-btn c1" data-color="1" title="Amarelo"></button>
    <button class="color-btn c2" data-color="2" title="Verde"></button>
    <button class="color-btn c3" data-color="3" title="Azul"></button>
    <button class="color-btn c4" data-color="4" title="Rosa"></button>
    <button class="color-btn c5" data-color="5" title="Laranja"></button>
    <button class="color-btn c-none" data-color="0" title="Remover cor">🚫</button>
  </div>
  <button class="action-btn btn-fav" id="btnToggleFav">
    <span>⭐</span> <span id="favBtnText">Adicionar aos Favoritos</span>
  </button>
  <button class="action-btn btn-close-menu" id="btnCloseMenu">Fechar</button>
</div>

<div id="toast" class="toast"></div>

<nav>
  <button class="active" id="navBooks"><span>📚</span> Livros</button>
  <button id="navFavorites"><span>⭐</span> Favoritos</button>
  <button id="navAbout"><span>ℹ️</span> Sobre</button>
</nav>

<script>
// ============================================================
// 📚 DADOS DOS 66 LIVROS DA BÍBLIA
// ============================================================
const LIVROS = [
  {id:'gn',num:1,nome:'Gênesis',caps:50,test:'AT',abbrev:'gn'},

  {id:'ez',num:26,nome:'Ezequiel',caps:48,test:'AT',abbrev:'ez'},
  {id:'dn',num:27,nome:'Daniel',caps:12,test:'AT',abbrev:'dn'},
  {id:'os',num:28,nome:'Oséias',caps:14,test:'AT',abbrev:'os'},

  {id:'2jo',num:63,nome:'2 João',caps:1,test:'NT',abbrev:'2jo'},
  {id:'3jo',num:64,nome:'3 João',caps:1,test:'NT',abbrev:'3jo'},
  {id:'jd',num:65,nome:'Judas',caps:1,test:'NT',abbrev:'jd'},
  {id:'ap',num:66,nome:'Apocalipse',caps:22,test:'NT',abbrev:'ap'}
];

// ============================================================
// 🌐 SISTEMA DE APIS COM FALLBACK INTELIGENTE
// ============================================================
const APIS = [
  {
    nome: 'Bible API (Almeida)',
    url: (livro, cap) => `https://bible-api.com/${livro.abbrev}+${cap}?translation=almeida`,
    parser: (dados) => {
      if (!dados || !dados.verses) return null;
      return dados.verses.map(v => ({ num: v.verse, texto: v.text }));
    }
  },
  {
    nome: 'ABíblia Digital (NVI)',
    url: (livro, cap) => `https://www.abibliadigital.com.br/api/verses/nvi/${livro.abbrev}/${cap}`,
    parser: (dados) => dados?.verses?.map(v => ({num: v.number, texto: v.text})) || null
  }
];

// ============================================================
// ESTADO DO APLICATIVO
// ============================================================
let currentTestament = 'AT';
let currentBook = null;
let currentChapter = 1;
let livrosSalvos = {};
let favorites = [];
let highlights = {}; // Novo: { "gn-1-1": "1", "jo-3-16": "3" }
let fontSize = 'medium';
let baixandoTodos = false;

try {
  livrosSalvos = JSON.parse(localStorage.getItem('biblia_multiapi_livros') || '{}');
  favorites = JSON.parse(localStorage.getItem('biblia_multiapi_favoritos') || '[]');
  highlights = JSON.parse(localStorage.getItem('biblia_multiapi_highlights') || '{}');
  fontSize = localStorage.getItem('biblia_multiapi_fontsize') || 'medium';
} catch(e) { console.error('Erro ao carregar dados', e); }

const $ = id => document.getElementById(id);
const showToast = msg => { const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); };

// ============================================================
// 🔄 FUNÇÃO PRINCIPAL — BUSCA EM APIS (FALLBACK)
// ============================================================
async function buscarVersiculos(livro, capitulo) {
  for(let i = 0; i < APIS.length; i++) {
    const api = APIS[i];
    atualizarStatusApi(i, 'busy');
    
    try {
      const url = api.url(livro, capitulo);
      const resposta = await fetch(url, { signal:AbortSignal.timeout(10000) });
      
      if(!resposta.ok) throw new Error(`Erro ${resposta.status}`);
      
      const dados = await resposta.json();
      const versiculos = api.parser(dados, livro, capitulo);
      
      if(versiculos && versiculos.length > 0) {
        atualizarStatusApi(i, 'ok');
        return versiculos;
      }
    } catch(erro) {
      atualizarStatusApi(i, 'fail');
    }
  }
  return null;
}

function initApiStatus() {
  const container = $('apiStatus');
  container.innerHTML = '';
  APIS.forEach((api, i) => {
    const span = document.createElement('span');
    span.className = 'api-tag ok';
    span.id = `api-tag-${i}`;
    span.textContent = `${api.nome.split(' ')[0]} ✅`;
    container.appendChild(span);
  });
}

function atualizarStatusApi(indice, status) {
  const tag = $(`api-tag-${indice}`);
  if(tag) {
    tag.classList.remove('ok','busy','fail');
    tag.classList.add(status);
    const icones = { ok:'✅', busy:'⏳', fail:'❌' };
    const nomeCurto = APIS[indice].nome.split(' ')[0];
    tag.textContent = `${nomeCurto} ${icones[status]}`;
  }
}

function resetarStatusApi() {
  APIS.forEach((_, i) => atualizarStatusApi(i, 'ok'));
}

// ============================================================
// INICIALIZAÇÃO
// ============================================================
function init(){
  initApiStatus();
  atualizarContador();
  renderizarLivros();
  aplicarTemaSalvo();
  aplicarFontSize();
}

function atualizarContador(){
  $('savedCount').textContent = Object.keys(livrosSalvos).length;
}

function renderizarLivros(){
  const list = $('bookList');
  list.innerHTML = '';
  LIVROS.filter(l => l.test === currentTestament).forEach(book => {
    const temSalvo = !!livrosSalvos[book.id];
    const btn = document.createElement('button');
    btn.className = 'book-btn' + (temSalvo ? ' loaded' : '');
    btn.dataset.book = book.id;
    btn.innerHTML = `<span class="num">${String(book.num).padStart(2,'0')}</span><span>${book.nome}</span><span class="status">${temSalvo ? '✅ Offline' : '⬇️ Baixar'}</span>`;
    btn.onclick = () => abrirLivro(book);
    list.appendChild(btn);
  });
}

// ============================================================
// 📖 ABRIR LIVRO — BAIXA OTIMIZADO OU CARREGA SALVO
// ============================================================
async function abrirLivro(book){
  currentBook = book;
  currentChapter = 1;
  
  if(livrosSalvos[book.id]) {
    mostrarTela('readScreen');
    $('bookTitle').textContent = `${book.num}. ${book.nome}`;
    carregarCapituloSalvo();
    return;
  }
  
  showToast(`📶 Baixando ${book.nome}...`);
  mostrarTela('readScreen');
  $('bookTitle').textContent = `${book.num}. ${book.nome}`;
  $('versesContainer').innerHTML = `<div class="loading"><span>📖</span> Preparando download...<br>Aguarde um momento.</div>`;
  
  const livroCompleto = {};
  let sucesso = true;
  
  try {
    $('versesContainer').innerHTML = `<div class="loading">📶 Baixando ${book.nome} completo (1/1)...</div>`;
    const url = `https://raw.githubusercontent.com/thiagobodruk/biblia/master/json/acf.json`;
    const resposta = await fetch(url, { signal: AbortSignal.timeout(30000) });
    if (resposta.ok) {
      const dados = await resposta.json();
      const bookData = dados.find(b => b.abbrev === book.abbrev) || dados[book.num - 1];
      if (bookData && bookData.chapters) {
        for(let cap = 1; cap <= book.caps; cap++) {
          if (bookData.chapters[cap - 1]) {
            livroCompleto[cap] = bookData.chapters[cap - 1].map((texto, i) => ({ num: i + 1, texto: texto.trim() }));
          }
        }
      }
    }
  } catch (e) {
    console.log("Falha ao baixar do GitHub, tentando APIs alternativas...", e);
  }

  if (Object.keys(livroCompleto).length < book.caps) {
    for(let cap = 1; cap <= book.caps; cap++) {
      if (livroCompleto[cap]) continue;
      
      resetarStatusApi();
      $('chapterTitle').textContent = `Capítulo ${cap}/${book.caps}`;
      $('versesContainer').innerHTML = `<div class="loading">📶 Buscando capítulo ${cap}/${book.caps}...</div>`;
      
      const versiculos = await buscarVersiculos(book, cap);
      
      if(!versiculos) {
        sucesso = false;
        showToast(`⚠️ Cap ${cap} não encontrado.`);
        break;
      }
      
      livroCompleto[cap] = versiculos;
    }
  }
  
  if(Object.keys(livroCompleto).length > 0) {
    livrosSalvos[book.id] = livroCompleto;
    try {
      localStorage.setItem('biblia_multiapi_livros', JSON.stringify(livrosSalvos));
    } catch(e) {
      showToast('⚠️ Memória do navegador cheia! Limpe com 🗑️');
    }
    atualizarContador();
    renderizarLivros();
  }
  
  if(sucesso && Object.keys(livroCompleto).length === book.caps) {
    showToast(`✅ ${book.nome} salvo offline!`);
    carregarCapituloSalvo();
  } else {
    $('versesContainer').innerHTML = `<div class="empty-state">⚠️ Não foi possível baixar todos os capítulos.<br>Verifique sua conexão e tente novamente.</div>`;
  }
}

// ============================================================
// 📥 BAIXAR TODOS OS LIVROS DE UMA VEZ
// ============================================================
$('btnDownloadAll').addEventListener('click', async () => {
  if(baixandoTodos) return showToast('⏳ Já está baixando...');
  if(!confirm('Isso pode demorar bastante e usar dados móveis. Tem certeza?')) return;
  
  baixandoTodos = true;
  let total = LIVROS.length;
  let feitos = 0;
  
  let bibleData = null;
  try {
    showToast('📶 Preparando download (baixando base completa)...');
    const resposta = await fetch('https://raw.githubusercontent.com/thiagobodruk/biblia/master/json/acf.json', { signal: AbortSignal.timeout(60000) });
    if (resposta.ok) bibleData = await resposta.json();
  } catch(e) {
    console.log("Não foi possível carregar o JSON principal, usando fallback por capítulo.");
  }

  for(const book of LIVROS) {
    if(livrosSalvos[book.id]) { feitos++; continue; }
    
    $('progressFill').style.width = `${(feitos/total)*100}%`;
    showToast(`Baixando ${book.nome} (${feitos+1}/${total})`);
    
    const livroCompleto = {};
    
    if (bibleData) {
      const bookData = bibleData.find(b => b.abbrev === book.abbrev) || bibleData[book.num - 1];
      if (bookData && bookData.chapters) {
        for(let cap = 1; cap <= book.caps; cap++) {
          if (bookData.chapters[cap - 1]) {
            livroCompleto[cap] = bookData.chapters[cap - 1].map((texto, i) => ({ num: i + 1, texto: texto.trim() }));
          }
        }
      }
    }
    
    if (Object.keys(livroCompleto).length < book.caps) {
      for(let cap = 1; cap <= book.caps; cap++) {
        if (livroCompleto[cap]) continue;
        const versiculos = await buscarVersiculos(book, cap);
        if (versiculos) livroCompleto[cap] = versiculos;
      }
    }
    
    if(Object.keys(livroCompleto).length > 0) {
      livrosSalvos[book.id] = livroCompleto;
      try {
        localStorage.setItem('biblia_multiapi_livros', JSON.stringify(livrosSalvos));
      } catch(e) {
        showToast('⚠️ Memória cheia!');
      }
    }
    feitos++;
    renderizarLivros();
  }
  
  $('progressFill').style.width = '100%';
  showToast(`✅ Concluído! ${feitos}/${total} livros baixados!`);
  baixandoTodos = false;
});

// ============================================================
// 📖 CARREGAR CAPÍTULO JÁ SALVO
// ============================================================
function carregarCapituloSalvo(){
  $('chapterTitle').textContent = `Capítulo ${currentChapter}`;
  $('btnPrev').disabled = currentChapter <= 1;
  $('btnNext').disabled = currentChapter >= currentBook.caps;
  
  const versiculos = livrosSalvos[currentBook.id]?.[currentChapter] || [];
  const cont = $('versesContainer');
  cont.innerHTML = '';
  
  if(!versiculos.length) {
    cont.innerHTML = `<div class="empty-state">⚠️ Capítulo ${currentChapter} não encontrado.<br>Baixe o livro novamente.</div>`;
    return;
  }
  
  versiculos.forEach(v => {
    const div = document.createElement('div');
    div.className = 'verse';
    
    const favId = `${currentBook.id}-${currentChapter}-${v.num}`;
    
    // Aplicar Favorito
    const isFav = favorites.includes(favId);
    if(isFav) div.classList.add('is-favorite');
    
    // Aplicar Destaque (Highlight)
    const hlColor = highlights[favId];
    if(hlColor && hlColor !== "0") {
      div.classList.add(`hl-${hlColor}`);
    }
    
    const textoFormatado = v.texto.replace(/\n/g, '<br>');
    div.innerHTML = `<span class="verse-num">${v.num}</span>${textoFormatado}<span class="verse-fav-icon">${isFav ? '❤️' : '🤍'}</span>`;
    div.onclick = () => abrirMenuVersiculo(favId, v.texto, isFav, hlColor);
    cont.appendChild(div);
  });
  window.scrollTo(0,0);
}

// ============================================================
// ⬅️➡️ NAVEGAÇÃO ENTRE CAPÍTULOS
// ============================================================
$('btnPrev').onclick = () => {
  if(currentChapter > 1) {
    currentChapter--;
    carregarCapituloSalvo();
  }
};

$('btnNext').onclick = () => {
  if(currentChapter < currentBook.caps) {
    currentChapter++;
    carregarCapituloSalvo();
  }
};

$('btnBack').onclick = () => {
  mostrarTela('booksScreen');
  currentBook = null;
  resetarStatusApi();
};

// ============================================================
// ⭐ FAVORITOS E 🎨 DESTAQUES (HIGHLIGHTS)
// ============================================================
let activeFavId = null;

function abrirMenuVersiculo(favId, texto, isFav, currentHl) {
  activeFavId = favId;
  
  // Atualizar botão de favorito
  const btnFav = $('btnToggleFav');
  const txtFav = $('favBtnText');
  if(isFav) {
    btnFav.classList.add('active');
    txtFav.textContent = 'Remover dos Favoritos';
  } else {
    btnFav.classList.remove('active');
    txtFav.textContent = 'Adicionar aos Favoritos';
  }

  // Atualizar botões de cor
  document.querySelectorAll('.color-btn').forEach(btn => {
    btn.classList.remove('active');
    if(btn.dataset.color === (currentHl || "0")) {
      btn.classList.add('active');
    }
  });

  $('menuOverlay').classList.add('show');
  $('verseActionMenu').classList.add('show');
}

function fecharMenu() {
  $('menuOverlay').classList.remove('show');
  $('verseActionMenu').classList.remove('show');
  activeFavId = null;
}

$('menuOverlay').onclick = fecharMenu;
$('btnCloseMenu').onclick = fecharMenu;

// Lógica de Destaque (Highlight)
document.querySelectorAll('.color-btn').forEach(btn => {
  btn.onclick = () => {
    if(!activeFavId) return;
    const cor = btn.dataset.color;
    
    if(cor === "0") {
      delete highlights[activeFavId];
      showToast('🚫 Destaque removido');
    } else {
      highlights[activeFavId] = cor;
      showToast('🎨 Versículo marcado!');
    }
    
    localStorage.setItem('biblia_multiapi_highlights', JSON.stringify(highlights));
    fecharMenu();
    carregarCapituloSalvo(); // Recarrega para aplicar a cor visualmente
  };
});

// Lógica de Favorito
$('btnToggleFav').onclick = () => {
  if(!activeFavId) return;
  const idx = favorites.indexOf(activeFavId);
  if(idx > -1) {
    favorites.splice(idx, 1);
    showToast('Removido dos favoritos');
  } else {
    favorites.push(activeFavId);
    showToast('⭐ Adicionado aos favoritos!');
  }
  localStorage.setItem('biblia_multiapi_favoritos', JSON.stringify(favorites));
  fecharMenu();
  carregarCapituloSalvo();
  if($('favoritesScreen').classList.contains('active')) renderizarFavoritos();
};

function renderizarFavoritos() {
  const list = $('favoritesList');
  list.innerHTML = '';
  
  if(favorites.length === 0) {
    list.innerHTML = `<div class="empty-state">Nenhum favorito ainda.<br>Toque em um versículo para salvar.</div>`;
    return;
  }
  
  favorites.forEach(favId => {
    const [bookId, cap, num] = favId.split('-');
    const livro = LIVROS.find(l => l.id === bookId);
    if(!livro || !livrosSalvos[bookId]?.[cap]) return;
    const versiculo = livrosSalvos[bookId][cap].find(v => v.num == num);
    if(!versiculo) return;
    
    const div = document.createElement('div');
    div.className = 'fav-item';
    
    // Aplicar cor de destaque no favorito também
    const hlColor = highlights[favId];
    if(hlColor && hlColor !== "0") div.classList.add(`hl-${hlColor}`);
    
    const textoFormatado = versiculo.texto.replace(/\n/g, '<br>');
    div.innerHTML = `<div class="fav-ref">${livro.num}. ${livro.nome} ${cap}:${num}</div><div class="fav-text">${textoFormatado}</div>`;
    div.onclick = () => {
      currentBook = livro;
      currentChapter = parseInt(cap);
      mostrarTela('readScreen');
      $('bookTitle').textContent = `${livro.num}. ${livro.nome}`;
      carregarCapituloSalvo();
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      $('navBooks').classList.add('active');
    };
    list.appendChild(div);
  });
}

// ============================================================
// 🔍 BUSCA DE CAPÍTULOS
// ============================================================
function abrirBusca() {
  $('searchModal').classList.add('show');
  const input = $('searchInput');
  input.value = '';
  setTimeout(() => input.focus(), 100);
}

function fecharBusca() {
  $('searchModal').classList.remove('show');
}

$('btnSearch').onclick = abrirBusca;
$('btnSearchCancel').onclick = fecharBusca;
$('searchModal').onclick = (e) => { if(e.target === $('searchModal')) fecharBusca(); };

$('searchInput').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') processarBusca();
});

$('btnSearchGo').onclick = processarBusca;

function processarBusca() {
  const query = $('searchInput').value.trim().toLowerCase();
  if(!query) return;

  // Normalizar acentos
  const normalize = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const qNorm = normalize(query);

  let livroAlvo = currentBook;
  let capAlvo = currentChapter;

  // Tenta extrair número do final (ex: "joão 3", "gn 1", "3")
  const match = qNorm.match(/^(.*?)(\d+)$/);
  
  if (match) {
    const nomeBusca = match[1].trim();
    capAlvo = parseInt(match[2]);

    if (nomeBusca.length > 0) {
      // Buscar livro por nome ou abreviação
      livroAlvo = LIVROS.find(l => 
        normalize(l.nome).includes(nomeBusca) || 
        l.abbrev === nomeBusca || 
        l.id === nomeBusca
      );
    }
  } else {
    // Se for apenas um número, assume o livro atual
    const numOnly = parseInt(query);
    if (!isNaN(numOnly)) {
      capAlvo = numOnly;
    }
  }

  if (!livroAlvo) {
    showToast('⚠️ Livro não encontrado. Ex: "João 3" ou "sl 23"');
    return;
  }

  if (capAlvo < 1 || capAlvo > livroAlvo.caps) {
    showToast(`⚠️ Capítulo inválido. ${livroAlvo.nome} tem ${livroAlvo.caps} capítulos.`);
    return;
  }

  fecharBusca();
  
  // Navegar e baixar se necessário
  currentBook = livroAlvo;
  currentChapter = capAlvo;
  mostrarTela('readScreen');
  $('bookTitle').textContent = `${livroAlvo.num}. ${livroAlvo.nome}`;
  
  if (!livrosSalvos[livroAlvo.id]) {
    abrirLivro(livroAlvo); // Isso já define o capítulo 1, então corrigimos depois
    // Forçar o capítulo correto após o download iniciar
    setTimeout(() => {
      currentChapter = capAlvo;
      carregarCapituloSalvo();
    }, 500);
  } else {
    carregarCapituloSalvo();
  }
}

// ============================================================
// 🔤 TAMANHO DA FONTE
// ============================================================
function aplicarFontSize() {
  const container = $('readScreen');
  container.classList.remove('size-small', 'size-medium', 'size-large');
  container.classList.add(`size-${fontSize}`);
  const labels = { small:'Aa (P)', medium:'Aa (M)', large:'Aa (G)' };
  $('btnFontSize').textContent = labels[fontSize];
}

$('btnFontSize').onclick = () => {
  const sizes = ['small', 'medium', 'large'];
  const idx = sizes.indexOf(fontSize);
  fontSize = sizes[(idx + 1) % sizes.length];
  localStorage.setItem('biblia_multiapi_fontsize', fontSize);
  aplicarFontSize();
  showToast(`Fonte: ${fontSize === 'small' ? 'Pequena' : fontSize === 'medium' ? 'Média' : 'Grande'}`);
};

// ============================================================
// 🎨 TEMA E NAVEGAÇÃO
// ============================================================
function mostrarTela(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  $('infoBar').classList.toggle('hidden', id !== 'booksScreen');
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    currentTestament = tab.dataset.test;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderizarLivros();
  };
});

$('navBooks').onclick = () => {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  $('navBooks').classList.add('active');
  mostrarTela('booksScreen');
  currentBook = null;
  resetarStatusApi();
};

$('navFavorites').onclick = () => {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  $('navFavorites').classList.add('active');
  renderizarFavoritos();
  mostrarTela('favoritesScreen');
};

$('navAbout').onclick = () => showToast('📖 Bíblia Multi-API\nBusca inteligente, 5 cores de destaque e modo Offline!');

$('btnTheme').onclick = () => {
  const escuro = document.body.classList.toggle('dark');
  localStorage.setItem('biblia_multiapi_tema', escuro ? 'dark' : 'light');
  $('btnTheme').textContent = escuro ? '☀️' : '🌙';
};

function aplicarTemaSalvo(){
  if(localStorage.getItem('biblia_multiapi_tema') === 'dark') {
    document.body.classList.add('dark');
    $('btnTheme').textContent = '☀️';
  }
}

$('btnClear').onclick = () => {
  if(!Object.keys(livrosSalvos).length && favorites.length === 0 && Object.keys(highlights).length === 0) return showToast('ℹ️ Nada para apagar.');
  if(confirm('Apagar TODOS os livros, favoritos, destaques e configurações?')) {
    localStorage.removeItem('biblia_multiapi_livros');
    localStorage.removeItem('biblia_multiapi_favoritos');
    localStorage.removeItem('biblia_multiapi_highlights');
    localStorage.removeItem('biblia_multiapi_fontsize');
    localStorage.removeItem('biblia_multiapi_tema');
    livrosSalvos = {}; favorites = []; highlights = {};
    atualizarContador(); renderizarLivros();
    showToast('🗑️ Tudo limpo!');
  }
};

init();
</script>
